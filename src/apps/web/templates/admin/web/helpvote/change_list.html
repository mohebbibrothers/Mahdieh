{% extends "admin/change_list.html" %}
{% block result_list %}
  {% if vote_summary %}
    <h2>خلاصهٔ پاسخ‌ها (نامفیدترین بالا)</h2>
    <table class="help-vote-summary">
      <thead>
        <tr><th>پرسش</th><th>مفید</th><th>نامفید</th><th>درصد رضایت</th></tr>
      </thead>
      <tbody>
        {% for row in vote_summary %}
          <tr>
            <td>{{ row.question }}</td>
            <td>{{ row.yes }}</td>
            <td>{{ row.no }}</td>
            <td>{{ row.ratio }}٪</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
    <br>
  {% endif %}
  {{ block.super }}
{% endblock %}
