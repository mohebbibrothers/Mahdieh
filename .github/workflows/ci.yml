# ══════════════════════════════════════════════════════════════════════════════
# CI مهدیه — همان گیت‌هایی که لوکال اجرا می‌شوند، اینجا «اجباری» می‌شوند.
# هیچ مرحله‌ای شکست را بی‌صدا نمی‌بلعد: نه «ادغام خطا» در مرحله‌ها روشن است، نه
# «‎|| true»ِ پنهان‌کننده. حتی اسکن آسیب‌پذیری هم «یافته» را قرمز نمی‌کند ولی
# «خرابی خودش» را قرمز می‌کند. آزمون test_ci_never_swallows_failure نگهبان همین
# قاعده است؛ پس این واژه‌ها در این فایل فقط در یک جا و به‌شکل توضیحی می‌آیند: نه.
# ══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.1"
  PYTHON_VERSION: "3.12"   # همان مفسر میزبان تولید (CloudLinux alt-python 3.12)
  DJANGO_SETTINGS_MODULE: config.settings.test
  # رمزهای تست — فقط برای CI، نه مقدار تولیدی (اشتراک‌گذاری‌شده و بی‌خطر)
  MAHDIEH_SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
  FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  FIELD_HASH_KEY: ci-only-hmac-key
  DATABASE_URL: mysql://mahdieh:mahdieh@127.0.0.1:3306/mahdieh

jobs:
  # ── انضباط کد: لینت و قالب ────────────────────────────────────────────────
  lint:
    name: 🧹 لینت و قالب
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - name: بررسی لینت (بدون اصلاح خودکار)
        run: uv run ruff check .
      - name: بررسی قالب
        run: uv run ruff format --check .

  # ── آزمون آشوب: تزریق خرابی سرویس‌های بیرونی و صف‌ها ───────────────────────
  chaos:
    name: 🌪 آزمون آشوب
    runs-on: ubuntu-latest
    services:
      mariadb:
        # همان شاخهٔ نسخهٔ میزبان تولید (MariaDB 11.4 LTS).
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mahdieh
          MARIADB_USER: mahdieh
          MARIADB_PASSWORD: mahdieh
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s
          --health-timeout 3s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - uses: ./.github/actions/mariadb-ready
        with:
          container: ${{ job.services.mariadb.id }}
      - name: آزمون‌های آشوب (ده تزریق خرابی)
        run: uv run pytest -q -m chaos src/tests/test_chaos.py

  # ── قلاب‌های پیش از کامیت: همان گیت‌های لوکال، اجباری در CI ───────────────
  precommit:
    name: 🪝 قلاب‌های پیش از کامیت (شامل detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # محیط قلاب‌ها (ruff/detect-secrets/…) با default_language_version ساخته می‌شود.
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/python-env
      - name: اجرای همهٔ قلاب‌ها روی همهٔ فایل‌ها
        # قلاب mypy با ``uv run mypy`` (محیط پروژه) اجرا می‌شود؛ پس پیش از آن
        # وابستگی‌ها سینک شده‌اند. همین قلاب‌ها لوکال هم اجرا می‌شوند، پس این کار
        # «دروازهٔ دوم» نیست: تضمین یکسانی محیط‌هاست.
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # ── تایپ سخت‌گیرانه ───────────────────────────────────────────────────────
  types:
    name: 🔒 بررسی نوع (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - run: uv run mypy

  # ── تست روی MariaDB واقعی (نسخهٔ تولید) — ماتریس مفسر ───────────────────────
  #    ۳.۱۲ = مفسر میزبان تولید؛ ۳.۱۳ = آمادگی برای ارتقای بعدی، بی‌غافلگیری.
  test:
    name: 🧪 تست (MariaDB 11.4 · Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      mariadb:
        # همان شاخهٔ نسخهٔ میزبان تولید (MariaDB 11.4 LTS).
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mahdieh
          MARIADB_USER: mahdieh
          MARIADB_PASSWORD: mahdieh
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s
          --health-timeout 3s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/mariadb-ready
        with:
          container: ${{ job.services.mariadb.id }}
      - name: اجرای تست‌ها با پوشش
        run: uv run pytest -q -n 4 --cov --cov-report=term-missing --cov-report=xml
      - name: گیت پوشش (راتچت صعودی)
        # راتچت پوشش — آستانه فقط بالا می‌رود؛ پایین‌آمدن پوشش = شکست.
        #   فاز ۰ (بنیان):          ۷۵٪
        #   انتقال به MariaDB:      ۸۵٪   ← امروز (پوشش واقعی ≈ ۸۷٫۶٪)
        # عددها عمداً «واقعی» هستند، نه آرمانی: گیت باید امروز معنا داشته باشد.
        env:
          COVERAGE_MIN: "85"
        run: |
          uv run python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          minimum = float(os.environ["COVERAGE_MIN"])
          tree = ET.parse("coverage.xml")
          rate = float(tree.getroot().attrib["line-rate"]) * 100
          print(f"پوشش خط: {rate:.2f}%  (حداقل فاز جاری: {minimum}%)")
          sys.exit(0 if rate >= minimum else 1)
          PY
      - name: ذخیرهٔ گزارش پوشش
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python }}
          path: coverage.xml
          retention-days: 7

  # ── بررسی سیستم و نبود drift مهاجرت ───────────────────────────────────────
  django:
    name: ⚙️ بررسی جنگو و مهاجرت
    runs-on: ubuntu-latest
    services:
      mariadb:
        # همان شاخهٔ نسخهٔ میزبان تولید (MariaDB 11.4 LTS).
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mahdieh
          MARIADB_USER: mahdieh
          MARIADB_PASSWORD: mahdieh
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s
          --health-timeout 3s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - uses: ./.github/actions/mariadb-ready
        with:
          container: ${{ job.services.mariadb.id }}
      - name: بررسی سیستم
        run: uv run python src/manage.py check
      - name: نبود drift مهاجرت (مدل بدون مهاجرت ممنوع)
        run: uv run python src/manage.py makemigrations --check --dry-run
      - name: اعتبارسنجی قرارداد OpenAPI
        run: uv run python src/manage.py spectacular --file /tmp/schema.yaml --validate

  # ── امنیت: SAST و وابستگی‌ها ───────────────────────────────────────────────
  security:
    name: 🛡 امنیت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - name: Bandit (SAST)
        run: uv run bandit -q -c pyproject.toml -r src
      - name: بررسی وابستگی‌های آسیب‌پذیر (گیت واقعی، مثل make verify)
        # پیش‌تر این خط ``|| true`` داشت؛ یعنی وابستگی CVE‌دار در CI «سبز» می‌شد.
        # همان درس: گیتِ بی‌دندان بدتر از نبودِ گیت است، چون اطمینان دروغ می‌دهد.
        run: uv run pip-audit

  # ── تصویر تولیدی: ساخت، استقرار واقعی روی میزبان، و کاوش امنیتی ────────────
  #    این کار سه چیز را ثابت می‌کند که هیچ تست واحدی نمی‌تواند:
  #      ۱. Dockerfile واقعاً می‌سازد و کانتینر با پیکربندی تولید بالا می‌آید.
  #      ۲. نقطهٔ ورود، مهاجرت و جمع‌آوری دارایی را اجرا می‌کند و دروازهٔ انتشار
  #         **خطای واقعی** را می‌بندد (آزمون منفی).
  #      ۳. کاوش امنیتی روی همان سامانهٔ زندهٔ تولیدی اجرا می‌شود و باید پاک باشد.
  docker-image:
    name: 🐳 تصویر تولیدی و کاوش امنیتی
    runs-on: ubuntu-latest
    services:
      mariadb:
        # همان شاخهٔ نسخهٔ میزبان تولید (MariaDB 11.4 LTS).
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mahdieh
          MARIADB_USER: mahdieh
          MARIADB_PASSWORD: mahdieh
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s
          --health-timeout 3s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mariadb-ready
        with:
          container: ${{ job.services.mariadb.id }}
      - name: ساخت تصویر تولیدی
        run: docker build --tag mahdieh:ci .
      - name: اجرای کانتینر با پیکربندی تولید (شبکهٔ میزبان تا به سرویس‌ها برسد)
        run: |
          docker run -d --name mahdieh-ci --network host \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e MAHDIEH_ENVIRONMENT=production \
            -e MAHDIEH_SECRET_KEY="$MAHDIEH_SECRET_KEY" \
            -e FIELD_ENCRYPTION_KEY="$FIELD_ENCRYPTION_KEY" \
            -e FIELD_HASH_KEY="$FIELD_HASH_KEY" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e MAHDIEH_ALLOWED_HOSTS="mahdie-shohada.ir,127.0.0.1,localhost" \
            -e MAHDIEH_SITE_URL="https://mahdie-shohada.ir" \
            -e MAHDIEH_SUPPORT_ADDRESS="مشهد، نوغان، کوچه ۱۱ شهید قائمی، درب سوم" \
            -e SMS_ENABLED=false \
            -e WEB_CONCURRENCY=2 \
            mahdieh:ci
      - name: انتظار برای سلامت سامانه (با تشخیص دقیق در ناکامی)
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/live/ >/dev/null; then
              echo "✅ سامانه بالا آمد (تلاش $attempt)"; exit 0
            fi
            sleep 2
          done
          echo "❌ کانتینر بالا نیامد. وضعیت و گزارش:"
          docker inspect --format 'وضعیت={{.State.Status}} · کد={{.State.ExitCode}} · شروع={{.State.StartedAt}}' mahdieh-ci || true
          docker logs mahdieh-ci --tail 200 || true
          exit 1
      - name: «نقطهٔ ورود» واقعاً کار خودش را کرد (مهاجرت، دارایی ایستا، دروازهٔ انتشار)
        # صرفِ بالا آمدن کانتینر کافی نیست: اگر ENTRYPOINT از قلم بیفتد، سایت بالا
        # می‌آید ولی پایگاه‌داده مهاجرت‌نشده می‌ماند. این مرحله اثر نقطهٔ ورود را از
        # گزارش خود کانتینر می‌خواند و آن را شرط می‌گذارد.
        run: |
          logs="$(docker logs mahdieh-ci 2>&1)"
          echo "$logs" | tail -20
          for needle in "اجرای مهاجرت" "جمع‌آوری دارایی" "دروازهٔ انتشار"; do
            echo "$logs" | grep -q "$needle" || { echo "❌ مرحلهٔ «$needle» در نقطهٔ ورود اجرا نشد."; exit 1; }
          done
          echo "✅ نقطهٔ ورود: مهاجرت + دارایی ایستا + دروازهٔ انتشار"
      - name: بررسی عمیق آمادگی، صفحهٔ اصلی و گفتار تولیدی
        run: |
          set -euo pipefail
          ready="$(curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ready/)"
          echo "$ready"
          echo "$ready" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="healthy", d; assert d["failed"]==[], d; print("✅ آمادگی healthy و بی‌ایراد")'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/)" = "200"
          echo "✅ صفحهٔ اصلی ۲۰۰ داد"
      - name: کاوش امنیتی روی سامانهٔ تولیدی (DAST)
        run: |
          docker run --rm --network host --entrypoint python mahdieh:ci \
            scripts/dast_probe.py --base-url http://127.0.0.1:8000 --behind-proxy
      - name: «دروازهٔ انتشار» نباید مهر لاستیکی باشد (آزمون منفی)
        run: |
          set +e
          output=$(docker run --rm --network host --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e MAHDIEH_ENVIRONMENT=production \
            -e MAHDIEH_SECRET_KEY="$MAHDIEH_SECRET_KEY" \
            -e MAHDIEH_ALLOWED_HOSTS="mahdie-shohada.ir" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e FIELD_ENCRYPTION_KEY="$FIELD_ENCRYPTION_KEY" -e FIELD_HASH_KEY="$FIELD_HASH_KEY" \
            -e SMS_ENABLED=true -e SMS_PROVIDER=iranpayamak -e SMS_API_KEY=k \
            -e SMS_SENDER_NUMBER=50002178584000 -e SMS_PATTERN_CODES= \
            mahdieh:ci src/manage.py production_check --strict 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "❌ باواسطه: پیامک روشن است ولی هیچ الگویی کد ندارد و دروازه سبز شد!"; exit 1
          fi
          echo "$output" | grep -q "mahdieh.W010" || { echo "❌ دلیل درست گزارش نشد"; exit 1; }
          echo "✅ دروازه در حالت سخت‌گیرانه، پیکربندی ناقص را رد کرد"
      - name: پاک‌سازی کانتینر
        if: always()
        run: |
          docker logs mahdieh-ci --tail 80 || true
          docker rm -f mahdieh-ci || true
      - name: سطح حملهٔ تصویر — ابزار مدیریت بستهٔ تصویر پایه حذف شده باشد
        # «حذف» بهتر از «نادیده‌گرفتن»: pip/setuptools/urllib3/msgpackِ تصویر
        # پایه هیچ‌جای مسیر اجرا استفاده نمی‌شوند. منطقِ بررسی در خودِ مخزن است
        # (scripts/image_attack_surface_check.sh) تا محلی هم آزمودنی باشد —
        # و آزموده شد: با مفسرِ آلوده قرمز می‌شود، با مفسرِ پاک سبز.
        run: docker run --rm --entrypoint bash mahdieh:ci /app/scripts/image_attack_surface_check.sh

      - name: اسکن آسیب‌پذیری تصویر — دروازهٔ واقعی (نه گزارش مشورتی)
        # خروجیِ این اسکن در ۱۴۰۵/۰۷/۲۵ خوانده و فهمیده شد:
        #   • تصویر پایهٔ خالی: ۰ CRITICAL و ۴ HIGH — و هر چهار HIGH در ابزارِ
        #     خودِ تصویر پایه بودند (pip/setuptools/urllib3/msgpack)، نه در کدِ ما.
        #   • آن چهار مورد با **حذف** برطرف شدند (مرحلهٔ قبل)، نه با نادیده‌گرفتن.
        # پس از این لحظه، هر یافتهٔ CRITICAL/HIGH **خبر تازه** است و باید انتشار
        # را متوقف کند؛ بنابراین `--exit-code 1` می‌گذاریم و گزارش را چاپ می‌کنیم.
        # نسخهٔ تصویر trivy هم پین است، وگرنه «دروازه» با هر به‌روزرسانیِ ابزار
        # معنی‌اش عوض می‌شود.
        # اگر روزی یافته‌ای آمد که رفعش در دست ما نیست: یا نسخهٔ تصویر پایه را
        # بالا ببرید، یا در `.trivyignore.yaml` با «دلیل + تاریخ انقضا» ثبتش
        # کنید. پنهان‌کردنِ خاموش (`|| true`) هرگز.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --format table mahdieh:ci

  # ── دروازهٔ مستندات و انضباط ساختار ───────────────────────────────────────
  docs-gate:
    name: 📚 گیت مستندات و ساختار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - name: بازتولید STRUCTURE.md و بررسی drift
        run: uv run python scripts/generate_structure.py --check
      - name: بررسی هم‌خوانی .env.example با تنظیمات
        run: uv run python scripts/check_env_parity.py
      - name: بررسی وجود سندهای الزامی
        run: |
          for f in README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md LICENSE \
                   docs/architecture/00-BLUEPRINT.md docs/architecture/01-DOMAIN-MODEL.md \
                   docs/architecture/02-ROADMAP.md; do
            test -f "$f" || { echo "❌ سند گم‌شده: $f"; exit 1; }
          done
          echo "✅ همهٔ سندهای الزامی موجودند"
