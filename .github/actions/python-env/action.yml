# محیط پایتونِ پروژه — یک تعریف، همهٔ شغل‌ها.
# mysqlclient روی PyPI چرخ لینوکسی ندارد؛ پس پیش از «uv sync» سرآیندهای کلاینت
# MariaDB و pkg-config نصب می‌شوند. نسخهٔ uv از env سراسریِ گردش‌کار (UV_VERSION) است.
name: محیط پایتون مهدیه
description: نصب سرآیندهای MariaDB، uv و وابستگی‌های قفل‌شده
inputs:
  python-version:
    description: نسخهٔ مفسر پایتون
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - name: سرآیندهای کلاینت MariaDB (برای ساخت mysqlclient)
      shell: bash
      # قطعی گذرای آینهٔ اوبونتو/DNS در اجراکننده‌ها نباید کل CI را بیندازد: مهلت کوتاه، تلاش دوباره
      # با فاصلهٔ فزاینده؛ پس از چهار شکست پیاپی، خطای واقعی گزارش می‌شود.
      run: |
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        for attempt in 1 2 3 4; do
          if sudo apt-get "${apt_opts[@]}" update -qq \
            && sudo apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends libmariadb-dev pkg-config; then
            exit 0
          fi
          echo "::warning::نصب سرآیندهای MariaDB در تلاش ${attempt} ناموفق بود؛ $((attempt * 30)) ثانیه بعد دوباره."
          sleep $((attempt * 30))
        done
        echo "::error::نصب سرآیندهای MariaDB پس از چهار تلاش ناموفق ماند."
        exit 1
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-suffix: py${{ inputs.python-version }}
    - name: وابستگی‌های قفل‌شده
      shell: bash
      run: uv sync --frozen --all-extras --python "${{ inputs.python-version }}"
    - name: قفل محیط برای گام‌های بعدی
      # بدون این، «uv run» در گام‌های بعدی طبق .python-version محیط را با مفسر
      # دیگری و بدون extraها از نو می‌سازد و ماتریس عملاً یک نسخه را می‌آزماید.
      shell: bash
      run: |
        {
          echo "UV_PYTHON=${{ inputs.python-version }}"
          echo "UV_NO_SYNC=1"
        } >> "$GITHUB_ENV"
        actual="$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
        if [[ "${actual}" != "${{ inputs.python-version }}" ]]; then
          echo "::error::مفسر محیط ${actual} است، نه ${{ inputs.python-version }}"
          exit 1
        fi
