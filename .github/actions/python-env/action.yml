# محیط پایتونِ پروژه — یک تعریف، همهٔ شغل‌ها.
# mysqlclient روی PyPI چرخ لینوکسی ندارد؛ پس پیش از «uv sync» سرآیندهای کلاینت
# MariaDB و pkg-config نصب می‌شوند. نسخهٔ uv از env سراسریِ گردش‌کار (UV_VERSION) است.
#
# تاب‌آوری شبکه (۱۴۰۵/۰۸/۲۰): اجراکننده‌های GitHub ساعتی هیچ میزبانِ ubuntu.com را resolve
# نمی‌کردند و همهٔ شغل‌ها در apt می‌افتادند. مسیر اصلی همچنان libmariadb (هم‌سان با میزبان
# تولید) است؛ اگر آرشیو اوبونتو در دسترس نباشد، mysqlclient روی کتابخانهٔ کلاینت MySQL که
# از پیش روی ایمیج اجراکننده هست از نو ساخته می‌شود — با کش جدا تا دو مسیر هرگز قاطی نشوند.
name: محیط پایتون مهدیه
description: نصب سرآیندهای MariaDB، uv و وابستگی‌های قفل‌شده
inputs:
  python-version:
    description: نسخهٔ مفسر پایتون
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - name: سرآیندهای کلاینت MariaDB (برای ساخت mysqlclient)
      shell: bash
      run: |
        apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
        install_headers() {
          sudo timeout 240 apt-get "${apt_opts[@]}" update -qq \
            && sudo timeout 240 apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends \
              libmariadb-dev pkg-config
        }
        # پرچم‌های ساخت صریح به mysqlclient داده می‌شود تا هرگز به کتابخانهٔ ناخواسته‌ای پیوند نخورد.
        use_client() {
          {
            echo "MAHDIEH_DB_CLIENT=$1"
            echo "MYSQLCLIENT_CFLAGS=$(pkg-config --cflags "$2")"
            echo "MYSQLCLIENT_LDFLAGS=$(pkg-config --libs "$2")"
          } >> "$GITHUB_ENV"
        }
        for attempt in 1 2; do
          if install_headers && pkg-config --exists libmariadb; then
            use_client mariadb libmariadb
            exit 0
          fi
          echo "::warning::نصب libmariadb-dev در تلاش ${attempt} ناموفق بود."
          sleep 20
        done
        if pkg-config --exists mysqlclient; then
          echo "::warning::آرشیو اوبونتو در دسترس نیست؛ mysqlclient این بار روی کلاینت MySQL ایمیج ساخته می‌شود."
          use_client mysql mysqlclient
          exit 0
        fi
        echo "::error::نه libmariadb-dev نصب شد و نه کلاینت MySQL جایگزین روی ایمیج هست."
        exit 1
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-suffix: py${{ inputs.python-version }}-${{ env.MAHDIEH_DB_CLIENT }}
    - name: وابستگی‌های قفل‌شده
      shell: bash
      run: |
        # در مسیر جایگزین، چرخِ کش‌شدهٔ mysqlclient (پیوندخورده به libmariadb.so.3) کنار گذاشته و
        # روی کتابخانهٔ موجود از نو ساخته می‌شود.
        extra=()
        if [[ "${MAHDIEH_DB_CLIENT}" == "mysql" ]]; then
          extra=(--refresh-package mysqlclient --reinstall-package mysqlclient)
        fi
        uv sync --frozen --all-extras --python "${{ inputs.python-version }}" "${extra[@]}"
        .venv/bin/python -c "import MySQLdb; print('mysqlclient', MySQLdb.version_info, '·', '${MAHDIEH_DB_CLIENT}')"
    - name: قفل محیط برای گام‌های بعدی
      # بدون این، «uv run» در گام‌های بعدی طبق .python-version محیط را با مفسر
      # دیگری و بدون extraها از نو می‌سازد و ماتریس عملاً یک نسخه را می‌آزماید.
      shell: bash
      run: |
        {
          echo "UV_PYTHON=${{ inputs.python-version }}"
          echo "UV_NO_SYNC=1"
        } >> "$GITHUB_ENV"
        actual="$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
        if [[ "${actual}" != "${{ inputs.python-version }}" ]]; then
          echo "::error::مفسر محیط ${actual} است، نه ${{ inputs.python-version }}"
          exit 1
        fi
