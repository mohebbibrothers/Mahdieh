version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly, day: saturday }
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
