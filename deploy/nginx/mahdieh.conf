# ══════════════════════════════════════════════════════════════════════════════
# Nginx جلوی مهدیه — TLS، دارایی ایستا، سد لبه‌ای، و پروکسی به کارگر ASGI
# ══════════════════════════════════════════════════════════════════════════════
# فلسفهٔ چیدمان: هر چیزی که Nginx ارزان‌تر انجام می‌دهد (فایل، فشرده‌سازی، TLS،
# محدودسازی نرخ) اینجا انجام می‌شود؛ اپ فقط کارِ دامنه را می‌کند. سد ظرفیت اپ
# (LOAD_SHEDDING_MAX_CONCURRENCY) آخرین تورِ ایمنی است، نه اولین.
#
# نصب:
#   sudo cp deploy/nginx/mahdieh.conf /etc/nginx/sites-available/mahdieh
#   sudo ln -s /etc/nginx/sites-available/mahdieh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream mahdieh_app {
    # کارگرهای گونیکورن روی لوپ‌بک؛ keepalive اتصال‌ها را بازاستفاده می‌کند.
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 32;
}

# ── محدودسازی نرخ در لبه: پیش از آنکه درخواست به اپ برسد ──
limit_req_zone $binary_remote_addr zone=mahdieh_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mahdieh_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=mahdieh_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mahdie-shohada.ir www.mahdie-shohada.ir;
    # هیچ محتوایی روی HTTP سرو نمی‌شود؛ فقط هدایت (و چالش ACME).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mahdie-shohada.ir www.mahdie-shohada.ir;

    # ── گواهی ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/mahdie-shohada.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahdie-shohada.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── امنیت ───────────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP سراسر اپ ساخته می‌شود (میان‌افزار جنگو با nonce)؛ اینجا تکرار نمی‌کنیم
    # تا دو سیاست متناقض نداشته باشیم.
    server_tokens off;

    # ── اندازه‌ها و زمان‌ها ─────────────────────────────────────────────────
    client_max_body_size 8m;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # آی‌پی واقعی کاربر به اپ می‌رسد (کلاینت‌آی‌پی، محدودسازی و حسابرسی)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── دارایی ایستا: مستقیم از دیسک (نه از پایتون) ─────────────────────────
    # فایل‌های نسخه‌دار و تغییرناپذیرند ⇒ کش یک‌ساله بی‌خطر است.
    location /static/ {
        alias /srv/mahdieh/src/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /media/ {
        alias /srv/mahdieh/src/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── مسیرهای ورود و پیامک: سقف سخت‌گیرانه‌تر (ضد سوءاستفادهٔ پیامکی) ──
    location ~ ^/(login|profile)/ {
        limit_req zone=mahdieh_auth burst=5 nodelay;
        limit_conn mahdieh_conn 10;
        proxy_pass http://mahdieh_app;
    }

    # ── API: سقف جداگانه تا یک اسکریپت بدرفتار، سایت را نخواباند ──
    location /api/ {
        limit_req zone=mahdieh_general burst=40 nodelay;
        limit_conn mahdieh_conn 20;
        proxy_pass http://mahdieh_app;
    }

    # ── پایش: هرگز محدود نمی‌شود (پایشگر باید همیشه پاسخ بگیرد) ──
    location /health/ {
        access_log off;
        proxy_pass http://mahdieh_app;
    }

    # ── بقیهٔ سایت ──
    location / {
        limit_req zone=mahdieh_general burst=60 nodelay;
        limit_conn mahdieh_conn 40;
        proxy_pass http://mahdieh_app;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # در قطعی اپ، صفحهٔ ۵۰۳ خودمان را نشان بده (بدون متن انگلیسی Nginx)
    error_page 502 503 504 /static/web/offline.html;
    location = /static/web/offline.html {
        internal;
        root /srv/mahdieh/src/staticfiles;
    }
}
