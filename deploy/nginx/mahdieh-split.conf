# ══════════════════════════════════════════════════════════════════════════════
# Nginx مهدیه — چیدمان «هم‌مبدأ» (ADR-0017): فرانت Next.js + API/مدیریت جنگو
# ══════════════════════════════════════════════════════════════════════════════
# یک دامنه، دو فرآیند:
#
#   https://mahdie-shohada.ir/            ⇒ Next.js   (127.0.0.1:3000) — همهٔ صفحه‌ها
#   https://mahdie-shohada.ir/api/…       ⇒ Django    (127.0.0.1:8000) — قرارداد JSON
#   https://mahdie-shohada.ir/django-admin/, /board/, /static/, /media/, /health/
#                                         ⇒ Django    — مدیریت، تابلوی پشتیبان، دارایی
#
# چرا هم‌مبدأ؟ کوکی نشست httpOnly + SameSite=Lax و CSRF بی‌هیچ CORS، بی‌پیش‌پرواز
# (preflight) و بی‌کوکیِ شخص ثالث کار می‌کند؛ مرورگر فقط یک مبدأ می‌بیند.
#
# پیش‌نیازهای محیط جنگو در این چیدمان:
#   MAHDIEH_CORS_ORIGINS=            (خالی — هم‌مبدأ است؛ CORS خاموش می‌ماند)
#   CSRF_TRUSTED_ORIGINS=https://mahdie-shohada.ir
#   ALLOWED_HOSTS=mahdie-shohada.ir,www.mahdie-shohada.ir,127.0.0.1
# پیش‌نیاز Next (فراخوانی سمت سرور): MAHDIEH_API_INTERNAL=http://127.0.0.1:8000 و
# ارسال Host/X-Forwarded-* و کوکی کاربر — مستند در ENGINEERING_STANDARDS فرانت.
#
# نصب (به‌جای mahdieh.conf، نه در کنارش):
#   sudo cp deploy/nginx/mahdieh-split.conf /etc/nginx/sites-available/mahdieh
#   sudo nginx -t && sudo systemctl reload nginx

upstream mahdieh_app {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 32;
}

upstream mahdieh_web {
    # سرور Next.js (output: "standalone")؛ ISR/کش اجزا در خود Next است.
    server 127.0.0.1:3000 fail_timeout=10s;
    keepalive 32;
}

# ── سدهای لبه ──
limit_req_zone $binary_remote_addr zone=mahdieh_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mahdieh_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=mahdieh_pages:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mahdieh_conn:10m;
limit_req_status 429;
limit_conn_status 503;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mahdie-shohada.ir www.mahdie-shohada.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mahdie-shohada.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mahdie-shohada.ir;
    ssl_certificate     /etc/letsencrypt/live/mahdie-shohada.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahdie-shohada.ir/privkey.pem;
    # یک مبدأ متعارف: کوکی‌ها و CSRF فقط روی دامنهٔ بی‌www معنا دارند.
    return 301 https://mahdie-shohada.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mahdie-shohada.ir;

    ssl_certificate     /etc/letsencrypt/live/mahdie-shohada.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahdie-shohada.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── امنیت مشترک (CSP را هر برنامه با nonce خودش می‌سازد؛ این‌جا تکرار نمی‌شود) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;
    server_tokens off;

    client_max_body_size 8m;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/problem+json application/javascript text/xml application/xml image/svg+xml text/calendar;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ══ جنگو ══════════════════════════════════════════════════════════════════

    location /static/ {
        alias /srv/mahdieh/src/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /media/ {
        alias /srv/mahdieh/src/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ورود، پیامک، عامل دوم: سخت‌ترین سد (هزینهٔ پیامک + هدف حدس‌زدن).
    location ~ ^/api/v1/auth/(otp|mfa)/|^/board/mfa/ {
        limit_req zone=mahdieh_auth burst=5 nodelay;
        limit_conn mahdieh_conn 10;
        proxy_pass http://mahdieh_app;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # گزارش اکسل: تولید کندتر است؛ سقف خواندن بالاتر و بافر خاموش (جریان مستقیم).
    location ~ ^/api/v1/staff/reports/ {
        limit_req zone=mahdieh_general burst=10 nodelay;
        limit_conn mahdieh_conn 5;
        proxy_pass http://mahdieh_app;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=mahdieh_general burst=40 nodelay;
        limit_conn mahdieh_conn 20;
        proxy_pass http://mahdieh_app;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # مدیریت جنگو و تابلوی پذیرش SSR (پشتیبانِ پنل Next در روزهای گذار و قطعی).
    location ~ ^/(django-admin|board)/ {
        limit_req zone=mahdieh_general burst=40 nodelay;
        limit_conn mahdieh_conn 20;
        proxy_pass http://mahdieh_app;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /csp-report/ {
        limit_req zone=mahdieh_general burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://mahdieh_app;
    }

    location /health/ {
        access_log off;
        proxy_pass http://mahdieh_app;
    }

    # ══ Next.js ═══════════════════════════════════════════════════════════════

    # بسته‌های نسخه‌دار Next — تغییرناپذیر؛ کش یک‌ساله.
    location /_next/static/ {
        proxy_pass http://mahdieh_web;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # همهٔ صفحه‌ها (شامل /verify/… و /feedback/… که پیوند پیامکی‌اند) با Next.
    location / {
        limit_req zone=mahdieh_pages burst=80 nodelay;
        limit_conn mahdieh_conn 40;
        proxy_pass http://mahdieh_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── چهرهٔ فارسیِ خطاهای لبه ──
    error_page 502 503 504 /static/web/offline.html;
    location = /static/web/offline.html {
        internal;
        root /srv/mahdieh/src/staticfiles;
        access_log off;
    }

    error_page 429 = @too_many;
    location @too_many {
        internal;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"درخواست‌های شما بیش از حد مجاز است؛ چند لحظه بعد دوباره تلاش کنید.","code":"rate_limited","retry_after":5}';
    }
}
