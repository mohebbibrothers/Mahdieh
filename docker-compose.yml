# سرویس‌های محلی مهدیه — محیط توسعه با تطبیق کامل عملیاتی.
# پایگاه‌داده همان موتور و نسخهٔ میزبان تولید است: MariaDB 11.4 با collation
# حساس به حروف (ADR-0020). کش هم روی همین پایگاه‌داده است (ADR-0021)؛ پس
# سرویس جداگانه‌ای برای کش/صف لازم نیست.
name: mahdieh

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_USER: mahdieh
      MARIADB_PASSWORD: mahdieh
      MARIADB_DATABASE: mahdieh
      MARIADB_ROOT_PASSWORD: mahdieh-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_as_cs
      - --transaction-isolation=READ-COMMITTED
      - --max-connections=151
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mariadbdata:/var/lib/mysql
      # کاربر توسعه باید پایگاه‌دادهٔ آزمون (test_mahdieh*) را هم بسازد.
      - ./deploy/dev/mariadb-init.sql:/docker-entrypoint-initdb.d/10-grants.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  mariadbdata:
  miniodata:
