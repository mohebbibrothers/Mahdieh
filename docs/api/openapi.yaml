components:
  schemas:
    Alternative:
      type: object
      description: یک بازهٔ جایگزین پیشنهادی وقتی بازهٔ درخواستی اشغال است.
      properties:
        unit_code:
          type: string
        unit_title:
          type: string
        floor_number:
          type: integer
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        date_jalali:
          type: string
        is_same_unit:
          type: boolean
      required:
      - date_jalali
      - end
      - floor_number
      - is_same_unit
      - start
      - unit_code
      - unit_title
    Block:
      type: object
      description: |-
        نمایش بلوک نگهداری — برای پنل کارکنان (دلیل در تقویم عمومی نمی‌آید).

        ``period`` صریح و ساخت‌یافته است (``{"start", "end"}``) نه رشتهٔ JSON فرارکرده؛
        تایپ‌های کلاینت فرانت باید مستقیم از سند OpenAPI ساخته شوند.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: شناسه
          description: شناسهٔ UUIDv7 — مرتب با زمان و غیرقابل‌حدس
        unit_code:
          type: string
          readOnly: true
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
              nullable: true
            end:
              type: string
              format: date-time
              nullable: true
          required:
          - start
          - end
          readOnly: true
        kind:
          enum:
          - maintenance
          - cleaning
          - event
          - admin
          type: string
          description: |-
            * `maintenance` - تعمیر و نگهداری
            * `cleaning` - نظافت اساسی
            * `event` - رویداد / مأموریت
            * `admin` - تصمیم مدیریتی
          x-spec-enum-id: 494288deff4253de
          title: نوع بلوک
        reason:
          type: string
          title: دلیل
          description: اجباری؛ در تقویم عمومی به‌صورت برچسب نشان داده می‌شود.
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: زمان ایجاد
      required:
      - created_at
      - id
      - kind
      - period
      - reason
      - unit_code
    BlockCreateRequest:
      type: object
      description: ورودی ثبت بلوک نگهداری توسط کارکنان (دلیل اجباری).
      properties:
        unit_code:
          type: string
          description: تهی ⇒ بلوک سراسری
          maxLength: 8
        start:
          type: string
          format: date-time
          description: آغاز بلوک (ISO 8601)
        end:
          type: string
          format: date-time
          description: پایان بلوک (ISO 8601)
        kind:
          type: string
          minLength: 1
          maxLength: 16
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - end
      - kind
      - reason
      - start
    Calendar:
      type: object
      description: پاسخ تقویم — روزها + فرادادهٔ سیاست.
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
        max_cells:
          type: integer
        min_cells:
          type: integer
        horizon_days:
          type: integer
        lattice:
          type: object
          additionalProperties:
            type: integer
      required:
      - days
      - horizon_days
      - lattice
      - max_cells
      - min_cells
    CalendarCell:
      type: object
      description: وضعیت یک نیم‌روز روی یک واحد.
      properties:
        index:
          type: integer
        kind:
          type: string
        label:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          type: string
        detail:
          type: string
      required:
      - detail
      - end
      - index
      - kind
      - label
      - start
      - status
    CalendarDay:
      type: object
      description: یک شبانه‌روز از تقویم موجودی.
      properties:
        day:
          type: string
          format: date
        date_jalali:
          type: string
        weekday:
          type: string
        is_weekend:
          type: boolean
        demand_level:
          type: string
        occupancy_rate:
          type: number
          format: double
        free_cells:
          type: integer
        total_cells:
          type: integer
        units:
          type: array
          items:
            $ref: '#/components/schemas/CalendarUnit'
      required:
      - date_jalali
      - day
      - demand_level
      - free_cells
      - is_weekend
      - occupancy_rate
      - total_cells
      - units
      - weekday
    CalendarUnit:
      type: object
      description: وضعیت یک واحد در یک روز.
      properties:
        code:
          type: string
        title:
          type: string
        floor_number:
          type: integer
        unit_type:
          type: string
        capacity_total:
          type: integer
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CalendarCell'
      required:
      - capacity_total
      - cells
      - code
      - floor_number
      - title
      - unit_type
    CancelPreview:
      type: object
      description: پیامد لغو در همین لحظه (سند).
      properties:
        cancellable:
          type: boolean
        late:
          type: boolean
        free_until:
          type: string
          format: date-time
        cooldown_hours:
          type: integer
        cooldown_until:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
      required:
      - cancellable
      - cooldown_hours
      - cooldown_until
      - free_until
      - late
      - message
    CancelRequest:
      type: object
      description: ورودی لغو رزرو.
      properties:
        reason_kind:
          type: string
          minLength: 1
          default: guest_request
          maxLength: 16
        reason:
          type: string
          maxLength: 300
    Certificate:
      type: object
      description: گواهی اقامت قابل‌چاپ (سند).
      properties:
        code:
          type: string
        holder:
          type: string
        issued_on:
          type: string
        short_code:
          type: string
        verify_url:
          type: string
          format: uri
        offline_check_url:
          type: string
          format: uri
        qr_svg:
          type: string
          description: SVG درون‌خطی (بدون اعلان XML)
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CertificateField'
      required:
      - code
      - fields
      - holder
      - issued_on
      - offline_check_url
      - qr_svg
      - short_code
      - verify_url
    CertificateField:
      type: object
      description: 'یک سطر گواهی: برچسب و مقدار.'
      properties:
        label:
          type: string
        value:
          type: string
      required:
      - label
      - value
    CertificateVerification:
      type: object
      description: نتیجهٔ تأیید آنلاین گواهی (سند).
      properties:
        valid:
          type: boolean
        crypto_valid:
          type: boolean
        mismatch:
          type: boolean
        error:
          type: string
        payload:
          type: object
          additionalProperties: {}
        reservation_status:
          type: string
          nullable: true
        checked_at:
          type: string
          format: date-time
      required:
      - checked_at
      - crypto_valid
      - error
      - mismatch
      - payload
      - reservation_status
      - valid
    Config:
      type: object
      description: پاسخ پیکربندی فرانت (سند؛ زیرساختارها ``object`` تعریف شده‌اند).
      properties:
        schema_version:
          type: integer
        site:
          type: object
          additionalProperties: {}
        features:
          type: object
          additionalProperties:
            type: boolean
        auth:
          type: object
          additionalProperties:
            type: integer
        lattice:
          type: object
          additionalProperties:
            type: integer
        policies:
          type: array
          items:
            type: object
            additionalProperties: {}
        units:
          type: array
          items:
            type: object
            additionalProperties: {}
        provinces:
          type: array
          items:
            type: object
            additionalProperties: {}
        countries:
          type: array
