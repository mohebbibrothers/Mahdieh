openapi: 3.0.3
info:
  title: Mahdieh Reservation Platform API
  version: 1.0.0
  description: |
    قرارداد رسمی API سامانهٔ مهدیه.

    • خطاها بر پایهٔ RFC 9457 (application/problem+json)
    • هم‌توانی نوشتن با هدر Idempotency-Key
    • نسخه‌بندی با Deprecation/Sunset (RFC 8594)
paths:
  /api/v1/meta:
    get:
      operationId: meta_retrieve
      description: نام سرویس، محیط، نسخهٔ قرارداد، منطقهٔ زمانی، امروزِ جلالی (با
        ارقام لاتین — قرارداد ماشینی) و — اگر در استقرار تنظیم شده باشد — اطلاعات
        تماس پذیرش. بدون احراز هویت و بی‌اثر بر داده.
      summary: فرادادهٔ سرویس
      tags:
      - فراداده
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: ''
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: کد یک‌بارمصرف را به شمارهٔ داده‌شده پیامک می‌کند. پاسخ برای شماره‌های
        ثبت‌شده و ثبت‌نشده یکسان است (ضد شمارش کاربران).
      summary: درخواست کد یک‌بارمصرف
      tags:
      - احراز هویت
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResult'
          description: ''
        '422':
          content:
            application/json:
              schema:
                type: object
                required:
                - type
                - title
                - status
                - detail
                - code
                properties:
                  type:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  code:
                    type: string
                  instance:
                    type: string
                  trace_id:
                    type: string
                  errors:
                    type: object
                    additionalProperties: true
              examples:
                نمونهٔبدنهٔخطا:
                  value:
                    type: https://docs.mahdieh.ir/problems/validation_error
                    title: ورودی نامعتبر
                    status: 422
                    detail: اطلاعات ارسالی کامل یا درست نیست.
                    code: validation_error
                    trace_id: 01HQ2Z4N6T9K8M7P5R3S1V0X2Y
                  summary: نمونهٔ بدنهٔ خطا
          description: ورودی نامعتبر
        '429':
          content:
            application/json:
              schema:
                type: object
                required:
                - type
                - title
                - status
                - detail
                - code
                properties:
                  type:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  code:
                    type: string
                  instance:
                    type: string
                  trace_id:
                    type: string
                  errors:
                    type: object
                    additionalProperties: true
              examples:
                نمونهٔبدنهٔخطا:
                  value:
                    type: https://docs.mahdieh.ir/problems/rate_limited
                    title: تعداد درخواست زیاد
                    status: 429
                    detail: کمی بعد دوباره تلاش کنید.
                    code: rate_limited
                    trace_id: 01HQ2Z4N6T9K8M7P5R3S1V0X2Y
                  summary: نمونهٔ بدنهٔ خطا
          description: تعداد درخواست زیاد
  /api/v1/auth/otp/verify:
