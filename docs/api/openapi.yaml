  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: کوکی ``csrftoken`` را تنظیم می‌کند و همان توکن را برمی‌گرداند.
        فرانت آن را در هدر ``X-CSRFToken`` همهٔ درخواست‌های نوشتنی می‌فرستد. پاسخ
        کش نمی‌شود.
      summary: دریافت توکن CSRF
      tags:
      - احراز هویت
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/session:
    get:
      operationId: auth_session_retrieve
      description: برای مهمان ``authenticated=false`` و ``profile=null``؛ هرگز ۴۰۱
        نمی‌دهد.
      summary: وضعیت نشست
      tags:
