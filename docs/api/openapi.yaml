components:
  schemas:
    Block:
      type: object
      description: |-
        نمایش بلوک نگهداری — برای پنل کارکنان (دلیل در تقویم عمومی نمی‌آید).

        ``period`` صریح و ساخت‌یافته است (``{"start", "end"}``) نه رشتهٔ JSON فرارکرده؛
        تایپ‌های کلاینت فرانت باید مستقیم از سند OpenAPI ساخته شوند.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: شناسه
          description: شناسهٔ UUIDv7 — مرتب با زمان و غیرقابل‌حدس
        unit_code:
          type: string
          readOnly: true
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
              nullable: true
            end:
              type: string
              format: date-time
              nullable: true
          required:
          - start
          - end
          readOnly: true
        kind:
          enum:
          - maintenance
          - cleaning
          - event
          - admin
          type: string
          description: |-
            * `maintenance` - تعمیر و نگهداری
            * `cleaning` - نظافت اساسی
            * `event` - رویداد / مأموریت
            * `admin` - تصمیم مدیریتی
          x-spec-enum-id: 494288deff4253de
          title: نوع بلوک
        reason:
          type: string
          title: دلیل
          description: اجباری؛ در تقویم عمومی به‌صورت برچسب نشان داده می‌شود.
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: زمان ایجاد
      required:
      - created_at
      - id
      - kind
      - period
      - reason
      - unit_code
    BlockCreateRequest:
      type: object
      description: ورودی ثبت بلوک نگهداری توسط کارکنان (دلیل اجباری).
