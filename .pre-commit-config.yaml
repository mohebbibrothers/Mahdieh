# قلاب‌های پیش از کامیت — همان گیت‌هایی که CI اجرا می‌کند، پیش از کامیت.
# فلسفه: خطا در ۵ ثانیه لوکال بهتر از ۵ دقیقه در CI است.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # نسخهٔ ruff این قلاب **همان** نسخهٔ قفل‌شدهٔ پروژه است (ruff 0.17.1).
  # چرا؟ با نسخهٔ قدیمی‌تر، قلاب قواعدی را گزارش می‌کرد که ruff جدید حذف کرده
  # (مثل UP038) و نتیجه این بود که «قلاب قرمز / CI سبز» یا برعکس. یک نسخه، یک
  # حقیقت: هر تغییری این‌جا باید با pyproject هم‌گام شود.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ── تایپ‌سنجی با **محیط پروژه** ────────────────────────────────────────────
  # چرا ``local`` و نه mirror آماده؟ mirror در یک محیط ایزوله اجرا می‌شود و
  # ``config.*`` (تنظیمات خود پروژه) را نمی‌شناسد؛ نتیجه: قلاب با
  # ``ModuleNotFoundError: No module named 'config'`` می‌شکند و کسی به آن اعتماد
  # نمی‌کند. این‌جا همان دستوری اجرا می‌شود که CI اجرا می‌کند (``mypy`` با
  # پیکربندی مخزن)، پس قلاب و دروازهٔ CI دقیقاً یکی هستند.
  - repo: local
    hooks:
      - id: mypy-project-env
        name: mypy (محیط پروژه، مثل CI)
        entry: uv run mypy
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "(uv\\.lock|package-lock\\.json)"
